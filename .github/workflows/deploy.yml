name: Build & Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      WX_APPID: ${{ secrets.WX_APPID }}
      WX_PRIVATE_KEY: ${{ secrets.WX_PRIVATE_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare upload metadata
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA="${GITHUB_SHA::7}"
          SHOULD_UPLOAD="true"
          UPLOAD_SKIP_REASON=""

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            BRANCH_NAME="${{ github.head_ref }}"
            UPLOAD_DESC="PR #${PR_NUMBER} ${BRANCH_NAME}: ${SHORT_SHA}"
            SOURCE_LABEL="PR #${PR_NUMBER}"
            SOURCE_BRANCH="${BRANCH_NAME}"

            if [ "${PR_DRAFT}" = "true" ]; then
              SHOULD_UPLOAD="false"
              UPLOAD_SKIP_REASON="PR is still a draft."
            elif echo "${PR_TITLE}" | grep -Eiq '^\[?WIP\]?|work in progress'; then
              SHOULD_UPLOAD="false"
              UPLOAD_SKIP_REASON="PR title is marked as WIP."
            fi
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            UPLOAD_DESC="develop experience: ${SHORT_SHA}"
            SOURCE_LABEL="develop"
            SOURCE_BRANCH="${{ github.ref_name }}"
          else
            UPLOAD_DESC="manual experience: ${SHORT_SHA}"
            SOURCE_LABEL="manual"
            SOURCE_BRANCH="${{ github.ref_name }}"
          fi

          echo "UPLOAD_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "UPLOAD_DESC=${UPLOAD_DESC}" >> "$GITHUB_ENV"
          echo "SOURCE_LABEL=${SOURCE_LABEL}" >> "$GITHUB_ENV"
          echo "SOURCE_BRANCH=${SOURCE_BRANCH}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "SHOULD_UPLOAD=${SHOULD_UPLOAD}" >> "$GITHUB_ENV"
          echo "UPLOAD_SKIP_REASON=${UPLOAD_SKIP_REASON}" >> "$GITHUB_ENV"

      - name: Build minigame
        run: npm run build:minigame

      - name: Upload WeChat experience version
        if: env.SHOULD_UPLOAD == 'true' && env.WX_APPID != '' && env.WX_PRIVATE_KEY != ''
        run: npm run upload:minigame:ci

      - name: Wait for PR to finish before upload
        if: env.SHOULD_UPLOAD != 'true'
        run: |
          echo "Build succeeded, but WeChat upload is waiting for the PR to be ready." >> "$GITHUB_STEP_SUMMARY"
          echo "${UPLOAD_SKIP_REASON}" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip upload without secrets
        if: env.SHOULD_UPLOAD == 'true' && (env.WX_APPID == '' || env.WX_PRIVATE_KEY == '')
        run: |
          echo "WeChat upload skipped because WX_APPID or WX_PRIVATE_KEY is unavailable." >> "$GITHUB_STEP_SUMMARY"
          echo "This can happen for forked PRs. Use a same-repository branch or manual workflow_dispatch if upload is required." >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          echo "## Deploy Result" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            if [ "${SHOULD_UPLOAD}" != "true" ]; then
              echo "Build succeeded. WeChat upload is waiting for the PR to be ready." >> $GITHUB_STEP_SUMMARY
            elif [ -n "${WX_APPID}" ] && [ -n "${WX_PRIVATE_KEY}" ]; then
              echo "WeChat experience version uploaded successfully." >> $GITHUB_STEP_SUMMARY
            else
              echo "Build succeeded, but WeChat upload was skipped because secrets were unavailable." >> $GITHUB_STEP_SUMMARY
            fi
            echo "Open WeChat DevTools or the Mini Game tester entry to verify." >> $GITHUB_STEP_SUMMARY
          else
            echo "Build or upload failed. Check the step logs above." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** minigame" >> $GITHUB_STEP_SUMMARY
          echo "**Source:** ${SOURCE_LABEL}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${SOURCE_BRANCH}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Short commit:** ${SHORT_SHA}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${UPLOAD_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Upload description:** ${UPLOAD_DESC}" >> $GITHUB_STEP_SUMMARY
          echo "**Should upload:** ${SHOULD_UPLOAD}" >> $GITHUB_STEP_SUMMARY
          echo "**Skip reason:** ${UPLOAD_SKIP_REASON:-none}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Playtest focus" >> $GITHUB_STEP_SUMMARY
          echo "- Confirm the experience version opens in WeChat." >> $GITHUB_STEP_SUMMARY
          echo "- For PRs, compare the build with the PR description and the kid's original idea." >> $GITHUB_STEP_SUMMARY
          echo "- Merge to develop only after the maintainer approves the PR." >> $GITHUB_STEP_SUMMARY
