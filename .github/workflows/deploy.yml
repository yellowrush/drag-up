name: Build & Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build minigame
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
        run: npm run build:minigame

      - name: Upload WeChat experience version
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_PRIVATE_KEY: ${{ secrets.WX_PRIVATE_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: npm run upload:minigame:ci

      - name: Summary
        if: always()
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "## Deploy Result" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "WeChat experience version uploaded successfully." >> $GITHUB_STEP_SUMMARY
            echo "Open WeChat DevTools or the Mini Game tester entry to verify." >> $GITHUB_STEP_SUMMARY
          else
            echo "Build or upload failed. Check the step logs above." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** minigame" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${VERSION}" >> $GITHUB_STEP_SUMMARY
