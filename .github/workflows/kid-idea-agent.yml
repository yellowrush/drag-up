name: Kid Idea Agent Router

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to route
        required: true
        type: string
      agent:
        description: Agent to route to
        required: true
        type: choice
        options:
          - copilot
          - codex
          - opencode

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  prepare:
    name: Parse agent command
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'issue_comment'
      }}
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.parse.outputs.agent }}
      issue_number: ${{ steps.parse.outputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          WD_AGENT: ${{ inputs.agent || '' }}
        with:
          script: |
            const body = (context.payload.comment?.body || '').trim().split('\n')[0]
            let agent = ''
            if (/^\/(cp|copilot)(\s|$)/i.test(body)) agent = 'copilot'
            else if (/^\/(cx|codex)(\s|$)/i.test(body)) agent = 'codex'
            else if (/^\/(oc|opencode)(\s|$)/i.test(body)) agent = 'opencode'
            if (context.eventName === 'workflow_dispatch') agent = process.env.WD_AGENT
            if (!agent) {
              console.log('No valid agent command found, skipping')
              if (context.eventName === 'workflow_dispatch') {
                core.setFailed('No agent specified')
              }
              return
            }
            core.setOutput('agent', agent)
            core.setOutput('issue_number', process.env.ISSUE_NUMBER)

  assign-copilot:
    needs: prepare
    if: needs.prepare.outputs.agent == 'copilot'
    runs-on: ubuntu-latest
    env:
      COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
      ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
    steps:
      - name: Check Copilot agent token
        if: env.COPILOT_AGENT_TOKEN == ''
        run: |
          echo "Missing COPILOT_AGENT_TOKEN." >> "$GITHUB_STEP_SUMMARY"
          echo "Create a fine-grained user token with Issues, Actions, Contents, and Pull requests read/write permissions for this repository." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Assign Copilot coding agent
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.COPILOT_AGENT_TOKEN }}
          script: |
            function buildThread(issue, comments) {
              const lines = [
                `Issue #${issue.number}: ${issue.title}`,
                '',
                '## Issue Body',
                issue.body || '',
                '',
                '## Comments',
              ]
              for (const c of comments) {
                lines.push(`\n### ${c.user.login} (${c.created_at})`)
                lines.push(c.body || '')
              }
              return lines.join('\n')
            }

            const owner = context.repo.owner
            const repo = context.repo.repo
            const issue_number = Number(process.env.ISSUE_NUMBER)

            const [issue, {data: comments}] = await Promise.all([
              github.rest.issues.get({ owner, repo, issue_number }),
              github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 })
            ])

            const thread = buildThread(issue.data, comments)

            const custom_instructions = [
              'Follow COLLABORATION-GUIDE.md.',
              'This is a kid idea task for the Drag Up game.',
              'Keep the pull request focused on this single issue.',
              'Prefer small level, copy, or gameplay changes before engine-wide changes.',
              'Follow docs/kid-idea-agent-output.md for PR evidence.',
              'For modification tasks, include a side-by-side Before / After comparison in the PR description.',
              'For new level tasks, include a Markdown table with one row per added level.',
              'Use branch names like codex/kid-idea-short-topic when possible.',
              'Run npm run build:minigame before finishing.',
              'Do not publish a production release.',
              'Do not edit secrets, account settings, cloud-function deployment settings, or private keys.',
              '',
              '--- Full Issue Thread ---',
              thread
            ].join('\n')

            await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/assignees', {
              owner,
              repo,
              issue_number,
              assignees: ['copilot-swe-agent[bot]'],
              agent_assignment: {
                target_repo: `${owner}/${repo}`,
                base_branch: 'develop',
                custom_instructions,
                custom_agent: '',
                model: ''
              }
            })

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: [
                'Assigned to GitHub Copilot coding agent.',
                '',
                'The agent should create a PR from `develop`. The PR build will upload a WeChat experience version for playtesting.'
              ].join('\n')
            })

            core.summary
              .addHeading('Copilot agent assigned')
              .addRaw(`Issue #${issue_number}`)
              .addBreak()
              .addRaw(`Target: ${owner}/${repo}@develop`)
              .write()

  assign-codex:
    needs: prepare
    if: needs.prepare.outputs.agent == 'codex'
    runs-on: ubuntu-latest
    env:
      CODEX_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
      ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
    steps:
      - name: Check Codex agent token
        if: env.CODEX_AGENT_TOKEN == ''
        run: |
          echo "Missing CODEX_AGENT_TOKEN or COPILOT_AGENT_TOKEN." >> "$GITHUB_STEP_SUMMARY"
          echo "Create a fine-grained user token with Issues, Actions, Contents, and Pull requests read/write permissions for this repository." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Assign Codex coding agent
        uses: actions/github-script@v7
        with:
          github-token: ${{ env.CODEX_AGENT_TOKEN }}
          script: |
            function buildThread(issue, comments) {
              const lines = [
                `Issue #${issue.number}: ${issue.title}`,
                '',
                '## Issue Body',
                issue.body || '',
                '',
                '## Comments',
              ]
              for (const c of comments) {
                lines.push(`\n### ${c.user.login} (${c.created_at})`)
                lines.push(c.body || '')
              }
              return lines.join('\n')
            }

            const owner = context.repo.owner
            const repo = context.repo.repo
            const issue_number = Number(process.env.ISSUE_NUMBER)

            const [issue, {data: comments}] = await Promise.all([
              github.rest.issues.get({ owner, repo, issue_number }),
              github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 })
            ])

            const thread = buildThread(issue.data, comments)

            const custom_instructions = [
              'Follow COLLABORATION-GUIDE.md.',
              'This is a kid idea task for the Drag Up game.',
              'Keep the pull request focused on this single issue.',
              'Prefer small level, copy, or gameplay changes before engine-wide changes.',
              'Follow docs/kid-idea-agent-output.md for PR evidence.',
              'For modification tasks, include a side-by-side Before / After comparison in the PR description.',
              'For new level tasks, include a Markdown table with one row per added level.',
              'Use branch names like codex/kid-idea-short-topic when possible.',
              'Run npm run build:minigame before finishing.',
              'Do not publish a production release.',
              'Do not edit secrets, account settings, cloud-function deployment settings, or private keys.',
              '',
              '--- Full Issue Thread ---',
              thread
            ].join('\n')

            await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/assignees', {
              owner,
              repo,
              issue_number,
              assignees: ['codex'],
              agent_assignment: {
                target_repo: `${owner}/${repo}`,
                base_branch: 'develop',
                custom_instructions,
                custom_agent: '',
                model: ''
              }
            })

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: [
                'Assigned to Codex coding agent.',
                '',
                'The agent should create a PR from `develop`. The PR build will upload a WeChat experience version for playtesting.'
              ].join('\n')
            })

            core.summary
              .addHeading('Codex agent assigned')
              .addRaw(`Issue #${issue_number}`)
              .addBreak()
              .addRaw(`Target: ${owner}/${repo}@develop`)
              .write()

  assign-opencode:
    needs: prepare
    if: needs.prepare.outputs.agent == 'opencode'
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
      API_KEY: ${{ secrets.API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Build issue context
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
        with:
          script: |
            function buildThread(issue, comments) {
              const lines = [
                `Issue #${issue.number}: ${issue.title}`,
                '',
                '## Issue Body',
                issue.body || '',
                '',
                '## Comments',
              ]
              for (const c of comments) {
                lines.push(`\n### ${c.user.login} (${c.created_at})`)
                lines.push(c.body || '')
              }
              return lines.join('\n')
            }

            const owner = context.repo.owner
            const repo = context.repo.repo
            const issue_number = Number(process.env.ISSUE_NUMBER)

            const [issue, {data: comments}] = await Promise.all([
              github.rest.issues.get({ owner, repo, issue_number }),
              github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 })
            ])

            const thread = buildThread(issue.data, comments)
            require('fs').writeFileSync('issue-context.md', thread)

      - name: Read key project files
        run: |
          echo "=== Repository Structure ===" > repo-context.txt
          find . -path './node_modules' -prune -o -path './.git' -prune -o -type f -print | sort | head -300 >> repo-context.txt
          echo "" >> repo-context.txt
          echo "=== COLLABORATION-GUIDE.md ===" >> repo-context.txt
          cat COLLABORATION-GUIDE.md 2>/dev/null >> repo-context.txt || echo "(not found)" >> repo-context.txt

      - name: Generate code with DeepSeek
        run: |
          CONTEXT=$(cat issue-context.md)
          REPO=$(cat repo-context.txt)

          if [ -z "$API_KEY" ]; then
            echo "Missing API_KEY secret." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          PAYLOAD=$(jq -n \
            --arg context "$CONTEXT" \
            --arg repo "$REPO" \
            '{
              model: "deepseek-chat",
              messages: [
                {
                  role: "system",
                  content: "You are an AI coding agent for the Drag Up game. Implement the issue by outputting a unified git diff (diff --git format). Read relevant files first from the repo context, then output ONLY a valid git diff that applies cleanly. Wrap the diff in ```diff ... ``` markdown block."
                },
                {
                  role: "user",
                  content: ("Issue thread:\n" + $context + "\n\nRepository:\n" + $repo + "\n\nRead any needed files from the repo listing above, then output a unified git diff implementing this issue.")
                }
              ]
            }')

          curl -s -X POST "https://api.deepseek.com/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -d "$PAYLOAD" > deepseek-response.json

          if jq -e '.error' deepseek-response.json > /dev/null; then
            echo "DeepSeek API error:" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.error.message' deepseek-response.json >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          jq -r '.choices[0].message.content // ""' deepseek-response.json > raw-output.txt
          # Strip markdown code fences and only keep diff content
          sed -n '/^```/,/^```/{/^```/d; p}' raw-output.txt | sed -n '/^diff --git/,$p' > changes.diff
          if [ ! -s changes.diff ]; then
            # No diff found, maybe raw output is just a plan; try using raw directly
            sed -n '/^diff --git/,$p' raw-output.txt > changes.diff
          fi
          if [ ! -s changes.diff ]; then
            echo "No git diff found in response." >> "$GITHUB_STEP_SUMMARY"
            echo "Raw output preview:" >> "$GITHUB_STEP_SUMMARY"
            head -50 raw-output.txt >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Apply diff and create PR
        run: |
          ISSUE_NUM="${{ needs.prepare.outputs.issue_number }}"
          BRANCH="opencode/kid-idea-issue-${ISSUE_NUM}"
          git config user.name "opencode-agent[bot]"
          git config user.email "opencode-agent[bot]@users.noreply.github.com"

          # Remove trailing whitespace that git apply may reject
          sed -i 's/[[:space:]]*$//' changes.diff

          if git apply --check --ignore-whitespace changes.diff 2>/dev/null; then
            git apply --ignore-whitespace changes.diff
            git add -A
            if git diff --cached --quiet; then
              echo "No changes after applying diff." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            git checkout -b "$BRANCH"
            git commit -m "feat: implement issue #${ISSUE_NUM}"

            # Push using GITHUB_TOKEN
            git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
            git push origin "$BRANCH"

            # Create PR using GitHub API with proper JSON
            PR_BODY=$(jq -n \
              --arg title "feat: implement issue #${ISSUE_NUM}" \
              --arg head "$BRANCH" \
              --arg base "develop" \
              --arg body "Implemented by OpenCode agent (DeepSeek V4 Flash).\n\nCloses #${ISSUE_NUM}." \
              '{title: $title, head: $head, base: $base, body: $body}')

            PR_URL=$(curl -s -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github.v3+json" \
              -d "$PR_BODY" \
              "https://api.github.com/repos/${{ github.repository }}/pulls" | jq -r '.html_url // .message')

            echo "PR created: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Diff does not apply cleanly. Will post as comment." >> "$GITHUB_STEP_SUMMARY"
            git apply --ignore-whitespace --reject changes.diff 2>&1 >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Post result comment
        if: always()
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
        with:
          script: |
            const fs = require('fs')
            const body = []

            try {
              const response = JSON.parse(fs.readFileSync('deepseek-response.json', 'utf8'))
              const errorText = response.error?.message || ''

              if (fs.existsSync('changes.diff') && fs.statSync('changes.diff').size > 0) {
                const diff = fs.readFileSync('changes.diff', 'utf8').slice(0, 25000)
                body.push('**OpenCode Agent (DeepSeek V4 Flash)**\n')
                body.push('Generated changes:\n')
                body.push('```diff')
                body.push(diff)
                body.push('```')
                body.push('\n---\n_Generated by OpenCode agent using DeepSeek V4 Flash_')
              } else if (errorText) {
                body.push('**OpenCode Agent (DeepSeek V4 Flash)**\n')
                body.push('API Error: ' + errorText)
              } else {
                body.push('**OpenCode Agent (DeepSeek V4 Flash)**\n')
                body.push('No changes generated.')
              }
            } catch {
              body.push('**OpenCode Agent (DeepSeek V4 Flash)**\n')
              body.push('Failed to generate or apply changes. Check workflow logs for details.')
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: body.join('\n')
            })
