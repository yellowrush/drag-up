<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drag Up 小朋友想法箱</title>
    <meta
      name="description"
      content="给 Drag Up 小游戏提交关卡、文案和玩法想法，并查看任务进度。"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Drag Up</p>
          <h1 id="page-title">小朋友想法箱</h1>
          <p class="intro">写下你想让游戏变成什么样，发送后这里会出现任务链接和进度。</p>
        </div>
      </section>

      <section class="composer" aria-labelledby="form-title">
        <h2 id="form-title">今天想改什么？</h2>
        <form id="idea-form">
          <label for="idea">你的想法</label>
          <textarea
            id="idea"
            name="idea"
            minlength="6"
            maxlength="1200"
            placeholder="比如：我想让第 5 关多一条路，这样不会卡太久。"
            required
          ></textarea>

          <label for="playtest">试玩时重点看哪里？</label>
          <textarea
            id="playtest"
            name="playtest"
            maxlength="600"
            placeholder="可以不填。比如：看看能不能通关，哪里太难。"
          ></textarea>

          <div class="actions">
            <button type="submit" id="submit-button">发送想法</button>
            <p id="form-status" role="status" aria-live="polite"></p>
          </div>
        </form>
      </section>

      <section class="issues" aria-labelledby="issues-title">
        <div class="section-heading">
          <div>
            <h2 id="issues-title">任务进度</h2>
            <p>这里会显示最近从想法箱生成的 GitHub Issue。</p>
          </div>
          <button type="button" id="refresh-button" class="secondary">刷新</button>
        </div>
        <div id="issue-list" class="issue-list" aria-live="polite">
          <p class="empty">正在读取任务列表...</p>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
